<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link href="https://unpkg.com/tabulator-tables@4.8.4/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.8.4/dist/js/tabulator.min.js"></script>
</head>
<body>
    <div id="tabulator-table"></div>
    <script>
        // Define your table data here, or you can load it dynamically using JavaScript
        var tabledata = [
            { id: 1, name: "John Doe", age: 30 },
            { id: 2, name: "Jane Smith", age: 25 }
        ];

        var table = new Tabulator("#tabulator-table", {
            data: tabledata,
            layout: "fitColumns",
            columns: [
                { title: "ID", field: "id" },
                { title: "Name", field: "name" },
                { title: "Age", field: "age" }
            ]
        });
    </script>
</body>
</html>
