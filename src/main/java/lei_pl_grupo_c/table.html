<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <link href="https://unpkg.com/tabulator-tables@4.8.4/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.8.4/dist/js/tabulator.min.js"></script>
    <script type="text/javascript">
        // Define function to load CSV data and pass it to loadDataIntoTable
        function fetchAndLoadCSV(url) {
            $.get(url, function (csvData) {
                var parsedData = Papa.parse(csvData, {
                    delimiter: ";",
                    header: true
                }).data;
                loadDataIntoTable(parsedData);
            });
        }

        // Load CSV data on page load
        $(document).ready(function () {
            // Assuming App instance is available as 'app'
            var jsonArray = app.getJsonArray();
            if (jsonArray != null) {
                loadDataIntoTable(jsonArray);
            } else {
                // Adjust the URL as needed
                fetchAndLoadCSV("files/your_csv_file.csv");
            }
        });

        function loadDataIntoTable(data) {
            var table = new Tabulator("#example-table", {
                data: data,
                layout: "fitDatafill",
                pagination: "local",
                paginationSize: 10,
                paginationSizeSelector: [5, 10, 20, 40],
                movableColumns: true,
                paginationCounter: "rows",
                initialSort: [{ column: "building", dir: "asc" }],
                columns: [
                    { title: "Descrição do Tipo de Sala", field: "classroomtypedescription", headerFilter: "input" },
                    { title: "Quantidade", field: "amountofclassroomsofthistype", headerFilter: "input" },
                    { title: "IDs das Salas", field: "classroomsids", headerFilter: "input" },
                ]
            });
        }
    </script>
</head>

<body>
    <h1>Tipos de Salas de Aula</h1>
    <div id="example-table"></div>
</body>

</html>
